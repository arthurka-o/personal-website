<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — Arthur Galiullin</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0e11'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' fill='%235fd39a' text-anchor='middle'%3E%E2%9E%A1%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Page-local: 404 stays a single self-contained file apart from the
         shared stylesheet. Tokens are the real ones from styles.css. */
      .nf {
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: var(--od-gap, 1rem);
        text-align: center;
        padding: 2rem;
      }
      .nf-code {
        font-family: var(--font-mono);
        font-size: clamp(3rem, 1rem + 12vw, 7rem);
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--accent);
      }
      .nf-text {
        max-width: 34ch;
        color: var(--text-muted);
      }
      .nf-home {
        font-family: var(--font-mono);
        text-decoration: none;
        border-bottom: 1px solid currentColor;
        padding-bottom: 2px;
      }
    </style>
  </head>

  <body>
    <main class="nf">
      <p class="nf-code" aria-hidden="true">404</p>
      <h1>No route to that address</h1>
      <p class="nf-text">
        The page you asked for isn't here. It may have moved, or the link that
        brought you in was typed by hand.
      </p>
      <a class="nf-home" href="/">&gt;_ back to index.html</a>
    </main>
  </body>
</html>

name: Deploy

# The page is rendered to static HTML before it is published, because a crawler
# that never runs JavaScript would otherwise see an empty page. So: build to
# static HTML, publish it, and never commit it — nothing generated is a source
# file, so nothing generated can drift from what it was generated from.
#
# Pages must be set to deploy from GitHub Actions, not from a branch: a branch
# deploy publishes main verbatim, which is the template with every list empty.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One deployment at a time. Two overlapping runs would each publish, and the
# second to finish would replace the first for no reason.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history, not just the tip: the staleness check below compares
      # commit times, and with a shallow clone both files look like they came
      # from the same commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The Node version comes from .nvmrc, the one file that names it, so the
      # runtime is the one that was chosen on purpose. A floating "22" would
      # silently change it under the build, and a runtime carries its own
      # security fixes. The pinned release carries the fix for
      # CVE-2026-111497, the out-of-bounds write in Node's Brotli decoder.
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      # cv.pdf is a committed binary and a runner has no WeasyPrint to rebuild
      # it with, so the build cannot refresh it. What it can do is refuse to
      # publish a PDF that no longer matches its markdown — which is exactly
      # how a stale one got published in the first place.
      - name: The CV PDF must not be stale
        run: |
          md=$(git log -1 --format=%ct -- tools/cv/Arthur_Galiullin_CV.md)
          pdf=$(git log -1 --format=%ct -- cv.pdf)
          if [ "$md" -gt "$pdf" ]; then
            echo "::error::cv.pdf is older than tools/cv/Arthur_Galiullin_CV.md."
            echo "Rebuild and commit it: python3 tools/cv/build.py"
            exit 1
          fi

      - name: Build the site
        run: npm run build

      - uses: actions/configure-pages@v6

      # A broken build must not replace a working live site.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # A pull request is checked, not published: a broken build should show up as
  # a failed check rather than pass silently.
  pr-check:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build succeeded; nothing to publish for a pull request."